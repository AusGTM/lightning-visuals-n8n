# config/icp_scoring.yaml

version: "lv-icp-v0.2"

# Phase 75 (D-75-05): the target-region whitelist. Selection criteria (record verbatim
# here, not in code): English-speaking or native-English-audience market with a strong
# sports-broadcasting ecosystem. Considered and NOT included: NG, KE, JM, PH.
regions:
  home:
    - AU
    - NZ
    - ANZ
    - US
    - GB
    - IE
    - CA
    - ZA
    - HK
    - SG
    - AE
    - IN
  # Phase 75 (D-75-08): the SINGLE country-name/ISO2 -> region-code table in the system.
  # Superset of the union of: n8n/code/normalizeProviders.js's deleted _COUNTRY_ISO2 map,
  # normalizeCountryRegion's/normalize_country_region's/zoominfo_country_region's own
  # literal lists, plus a self-alias for every regions.home code. Keys are lowercase; every
  # lookup lowercases its input first. tests/n8n/regionAliasParity.test.mjs pins this
  # against a frozen historical key list.
  aliases:
    australia: AU
    au: AU
    aus: AU
    new zealand: NZ
    nz: NZ
    anz: ANZ
    us: US
    united states: US
    united states of america: US
    canada: CA
    ca: CA
    united kingdom: GB
    great britain: GB
    england: GB
    gb: GB
    ireland: IE
    republic of ireland: IE
    ie: IE
    south africa: ZA
    za: ZA
    hong kong: HK
    hong kong sar: HK
    hk: HK
    singapore: SG
    sg: SG
    united arab emirates: AE
    uae: AE
    ae: AE
    india: IN
    in: IN

base_score:
  org_type:
    governing_body_league: 40
    content_producer: 20
    broadcaster: 20
    individual_club_team: 15
    regulator: -20
    gambling_operator: 0
    hardware_vendor: 0
    other: 0
    unknown: 0

  produces_content:
    true: 20
    false: 0
    unknown: 0

  geography:
    home: 10
    other: 0
    unknown: 0

  revenue_band:
    "<1M": 0
    "1-5M": 0
    "5-50M": 10
    "50-500M": 10
    "500-750M": -5
    "750M-1B": -15
    "1B-1.2B": -30
    "1.2B+": -50
    unknown: 0

graduated_deductions: {}

hard_vetoes:
  outside_home_regions:
    enabled: true
    reason: "Outside target regions"

  no_content:
    enabled: true
    reason: "No broadcast or streaming content"

  hardware_vendor:
    enabled: true
    reason: "Hardware/AV/LED vendor, not sports-media buyer"

tier_rules:
  A:
    min_score: 70
    max_score: 999
    requires_no_hard_veto: true

  B:
    min_score: 40
    max_score: 69
    requires_no_hard_veto: true

  C:
    min_score: 15
    max_score: 39
    requires_no_hard_veto: true

  D:
    hard_veto: true

  Unscored:
    missing_required_inputs: true

recommended_motion:
  A: work_direct
  B: work_direct
  C: nurture_or_work_via_league
  D: disqualify
  Needs Review: research_more
  Unscored: research_more
