# config/escalation_policy.yaml

haiku_default:
  use_for:
    - normalization
    - simple field classification
    - persona grouping
    - seniority extraction
    - evidence summarization
    - first_pass_icp_scoring
  max_risk: medium

sonnet_5:
  use_when:
    - field_conflict: true
    - hard_veto_possible: true
    - anti_icp_flag_would_change: true
    - lv_org_type_conflict: true
    - lv_produces_content_conflict: true
    - gambling_operator_detected: true
    - hardware_vendor_detected: true
    - canonical_overwrite_requested: true
    # Escalate to Sonnet when confidence falls in this band: docs/WEB-RESEARCH-SPEC.md
    # §8 JG-1 states "confidence in 75-85" normatively. (Prior [70, 85] was reconstructed
    # from CLAUDE.md §15.1's corrupted `[2][3]` markdown footnote artifact and was never
    # parsed by any code — this is the first real consumer.)
    - confidence_between: [75, 85]
    - multiple_sources_disagree: true
  output_required:
    - decision
    - chosen_value
    - confidence
    - evidence_url
    - evidence_summary
    - validation_status
    - reason

human_review:
  use_when:
    - sonnet_confidence_below: 80
    - no_evidence_url_for_required_field: true
    - hard_veto_uncertain: true
    - provider_and_web_research_conflict: true
    - canonical_manual_value_conflict: true

evidence_sufficiency:
  # JG-4: a citation on one of these hosts substantiates content output even though
  # the host is not the company's own domain (owned channel). Non-root path still
  # required. Validated against the 20 real rows in the Phase-13 closed-won/lost smoke.
  known_video_hosts:
    - youtube.com
    - youtu.be
    - vimeo.com
    - twitch.tv
