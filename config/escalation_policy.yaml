# config/escalation_policy.yaml

haiku_default:
  use_for:
    - normalization
    - simple field classification
    - persona grouping
    - seniority extraction
    - evidence summarization
    - first_pass_icp_scoring
  max_risk: medium

sonnet_5:
  use_when:
    - field_conflict: true
    - hard_veto_possible: true
    - anti_icp_flag_would_change: true
    - lv_org_type_conflict: true
    - lv_produces_content_conflict: true
    - gambling_operator_detected: true
    - hardware_vendor_detected: true
    - canonical_overwrite_requested: true
    # Escalate to Sonnet when confidence falls in this band: docs/WEB-RESEARCH-SPEC.md
    # §8 JG-1 states "confidence in 75-85" normatively. (Prior [70, 85] was reconstructed
    # from CLAUDE.md §15.1's corrupted `[2][3]` markdown footnote artifact and was never
    # parsed by any code — this is the first real consumer.)
    - confidence_between: [75, 85]
    - multiple_sources_disagree: true
    - field_conflict: true
  # Operator ruling 2026-08-26 (gap-closure 58-06, execution 11983): the decision-driving
  # field groups that ALWAYS route to judge-or-review on a cross-provider disagreement --
  # CLAUDE.md §21.2's veto-flip gate, enforced structurally rather than by convention.
  # Modelled as GROUPS, not bare field names, because lv_country_region_normalized and
  # native `country` are one disputed fact with two HubSpot serializations: a conflict on
  # EITHER member suppresses BOTH under one reason (n8n/code/providerConflict.js's
  # groupConflicts()). src/judge.py reads this list the way it reads confidence_between
  # above; scripts/gen_escalation_js.py emits it into n8n/code/escalation.generated.js as
  # MATERIAL_CONFLICT_GROUPS -- there is no second hand-typed copy.
  material_conflict_field_groups:
    - name: country_region
      fields: [lv_country_region_normalized, country]
    - name: org_type
      fields: [lv_org_type]
    - name: produces_content
      fields: [lv_produces_content]
    - name: hardware_vendor
      fields: [lv_is_hardware_vendor]
    - name: gambling_operator
      fields: [lv_is_gambling_operator]
  output_required:
    - decision
    - chosen_value
    - confidence
    - evidence_url
    - evidence_summary
    - validation_status
    - reason

human_review:
  use_when:
    - sonnet_confidence_below: 80
    - no_evidence_url_for_required_field: true
    - hard_veto_uncertain: true
    - provider_and_web_research_conflict: true
    - canonical_manual_value_conflict: true

evidence_sufficiency:
  # JG-4: a citation on one of these hosts substantiates content output even though
  # the host is not the company's own domain (owned channel). Non-root path still
  # required. Validated against the 20 real rows in the Phase-13 closed-won/lost smoke.
  known_video_hosts:
    - youtube.com
    - youtu.be
    - vimeo.com
    - twitch.tv
