      label: "LV Org Type Verified At"
      type: datetime
      fieldType: date
      groupName: lv_enrichment
      options: []
    - name: lv_produces_content_verified_at
      label: "LV Produces Content Verified At"
      type: datetime
      fieldType: date
      groupName: lv_enrichment
      options: []

    # --- review surface (9, PN-5, created now per locked decision 1) ---
