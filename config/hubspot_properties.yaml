  - name: lv_icp_fit_score
    label: ICP Fit Score
    type: number
    fieldType: calculation_equation
    groupName: companyinformation
    options: []
  - name: lv_icp_tier_derived
    label: ICP Tier (Derived)
    type: string
    fieldType: calculation_equation
    groupName: companyinformation
    options: []
    calculationFormula: 'if coalesce(lv_anti_icp_flag, 0) = 1 then "D" elseif coalesce(lv_icp_fit_score, -1) >= 70 then "A" elseif coalesce(lv_icp_fit_score, -1) >= 40 then "B" elseif coalesce(lv_icp_fit_score, -1) >= 15 then "C" else "Unscored"'
