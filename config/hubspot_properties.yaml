      groupName: lv_enrichment
      options: []
    - name: lv_enrichment_reviewed_by
      label: "LV Enrichment Reviewed By"
      type: string
      fieldType: text
      groupName: lv_enrichment
      options: []
    - name: lv_enrichment_reviewed_at
