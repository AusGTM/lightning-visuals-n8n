# config/hubspot_properties.yaml
#
# Phase 15 Task 2 — the single desired-state manifest for scripts/sync_hubspot_properties.py.
#
# PROVENANCE MODEL (coordinator decision, supersedes RESEARCH.md §6's 121-145 flat-suffix
# design): per-field enrichment metadata rides in ONE JSON text property per object
# (lv_enrichment_provenance / lv_contact_enrichment_provenance) plus 4 carve-out
# `_verified_at` cache-key datetimes that stay top-level and queryable (HubSpot cannot
# filter inside a JSON text property; RT-5/SJ-2 need to query "verified_at older than 180
# days"). Staging folds into the blob too — no `lv_waterfall_*`/`lv_claude_web_*`
# properties are created (STAGING SCOPE CALL, PLAN.md scope_notes).
#
# Manifest size: 19 company + 14 contact = 33 properties + 2 groups.
#
# lv_org_type / lv_produces_content already exist (portal audit 2026-07-20) and are
# deliberately NOT listed here — sync_hubspot_properties.py only creates what is missing;
# listing an already-existing property here would be harmless (create-list = desired -
# actual) but is omitted per the plan's explicit instruction to keep this file small.
#
# C3 (out of scope, one-way door): lv_org_type text->enumeration is NOT scheduled anywhere
# in this manifest or the sync script.

companies:
  groups:
    - name: lv_enrichment
      label: "LV Enrichment"
  properties:
    # --- canonical INPUT properties (7) ---
    - name: lv_content_type
      label: "LV Content Type"
      type: enumeration
      fieldType: checkbox
      groupName: lv_enrichment
      options:
        - {label: "Live Broadcast", value: live_broadcast, displayOrder: 0, hidden: false}
        - {label: "Streaming", value: streaming, displayOrder: 1, hidden: false}
        - {label: "Near Live", value: near_live, displayOrder: 2, hidden: false}
        - {label: "Highlights", value: highlights, displayOrder: 3, hidden: false}
        - {label: "None", value: none, displayOrder: 4, hidden: false}
        - {label: "Unknown", value: unknown, displayOrder: 5, hidden: false}
    - name: lv_revenue_band
      label: "LV Revenue Band"
      type: enumeration
      fieldType: select
      groupName: lv_enrichment
      options:
        - {label: "<1M", value: "<1M", displayOrder: 0, hidden: false}
        - {label: "1-5M", value: "1-5M", displayOrder: 1, hidden: false}
        - {label: "5-50M", value: "5-50M", displayOrder: 2, hidden: false}
        - {label: "50-500M", value: "50-500M", displayOrder: 3, hidden: false}
        - {label: "500-750M", value: "500-750M", displayOrder: 4, hidden: false}
        - {label: "750M-1B", value: "750M-1B", displayOrder: 5, hidden: false}
        - {label: "1B-1.2B", value: "1B-1.2B", displayOrder: 6, hidden: false}
        - {label: "1.2B+", value: "1.2B+", displayOrder: 7, hidden: false}
        - {label: "Unknown", value: unknown, displayOrder: 8, hidden: false}
    - name: lv_employee_band
      label: "LV Employee Band"
      type: enumeration
      fieldType: select
      groupName: lv_enrichment
      options:
        - {label: "1-9", value: "1-9", displayOrder: 0, hidden: false}
        - {label: "10-50", value: "10-50", displayOrder: 1, hidden: false}
        - {label: "51-200", value: "51-200", displayOrder: 2, hidden: false}
        - {label: "201-500", value: "201-500", displayOrder: 3, hidden: false}
        - {label: "501-1000", value: "501-1000", displayOrder: 4, hidden: false}
        - {label: "1001+", value: "1001+", displayOrder: 5, hidden: false}
        - {label: "Unknown", value: unknown, displayOrder: 6, hidden: false}
    - name: lv_country_region_normalized
      label: "LV Country/Region (normalized)"
      type: enumeration
      fieldType: select
      groupName: lv_enrichment
      options:
        - {label: "AU", value: AU, displayOrder: 0, hidden: false}
        - {label: "NZ", value: NZ, displayOrder: 1, hidden: false}
        - {label: "ANZ", value: ANZ, displayOrder: 2, hidden: false}
        - {label: "US", value: US, displayOrder: 3, hidden: false}
        - {label: "UK", value: UK, displayOrder: 4, hidden: false}
        - {label: "EU", value: EU, displayOrder: 5, hidden: false}
        - {label: "Other", value: Other, displayOrder: 6, hidden: false}
        - {label: "Unknown", value: Unknown, displayOrder: 7, hidden: false}
    - name: lv_is_hardware_vendor
      label: "LV Is Hardware Vendor"
      type: bool
      fieldType: booleancheckbox
      groupName: lv_enrichment
      options: []
    - name: lv_is_gambling_operator
      label: "LV Is Gambling Operator"
      type: bool
      fieldType: booleancheckbox
      groupName: lv_enrichment
      options: []
    - name: lv_sponsorship_reliant
      label: "LV Sponsorship Reliant"
      type: bool
      fieldType: booleancheckbox
      groupName: lv_enrichment
      options: []

    # --- provenance blob (1) ---
    - name: lv_enrichment_provenance
      label: "LV Enrichment Provenance"
      type: string
      fieldType: textarea
      groupName: lv_enrichment
      options: []

    # --- cache keys (2, queryable — RT-5/SJ-2) ---
