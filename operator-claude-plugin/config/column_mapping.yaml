# config/column_mapping.yaml
#
# One source of truth for Phase 6 ingestion:
#   aliases:           lowercased/trimmed source header -> canonical HubSpot contact prop
#   required_identity: the reject rule -- any_of the identity groups below
#                      (email OR firstname+lastname+company OR linkedin_url).
#                      linkedin_url added Phase 61-03; name-only rows still route to
#                      the weak-key needs_review path (D-61-03), they are not accepted here.
#                      Do not restate the groups anywhere else: extraction.py derives its
#                      rejection message from this block, and tests/n8n/columnMapIdentityParity
#                      pins n8n/code/columnMap.js against it.
# Header lookup is case-insensitive and whitespace-collapsed (see column_mapper.map_row).

aliases:
  # email
  email: email
  "email address": email
  "e-mail": email
  "e-mail address": email
  # firstname
  firstname: firstname
  "first name": firstname
  fname: firstname
  "given name": firstname
  # lastname
  lastname: lastname
  "last name": lastname
  surname: lastname
  # jobtitle
  jobtitle: jobtitle
  "job title": jobtitle
  title: jobtitle
  position: jobtitle
  # linkedin_url
  linkedin_url: linkedin_url
  linkedin: linkedin_url
  "linkedin url": linkedin_url
  li: linkedin_url
  "linkedin profile": linkedin_url
  # phone
  phone: phone
  mobile: phone
  tel: phone
  # company
  company: company
  organization: company
  organisation: company
  account: company
  "org.": company

  # company_id — the operator's manual contact->company association override
  # (2026-08-25). Not a HubSpot contact property: it rides the row, is read only by the
  # ingest lane's Build Company Link, and is never written as a property.
  company_id: company_id
  "company id": company_id
  "hubspot company id": company_id
  "associated company id": company_id
  "associatedcompanyid": company_id

required_identity:
  any_of:
    - [email]
    - [firstname, lastname, company]
    - [linkedin_url]
